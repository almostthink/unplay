name: Build mail_checker.exe

on:
  push:
    branches: [ "**" ]
    paths:
      - "mail_checker.py"
      - "mailbox_manager.py"
      - "gui.py"
      - "web/**"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build GUI exe (HTML/CSS front end)
        run: pyinstaller --onefile --windowed --name mail_checker_gui --add-data "web;web" gui.py

      - name: Build console/CLI exe
        run: pyinstaller --onefile --console --name mail_checker mail_checker.py

      - name: Upload GUI exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail_checker_gui-windows-exe
          path: dist/mail_checker_gui.exe

      - name: Upload CLI exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail_checker-windows-exe
          path: dist/mail_checker.exe
