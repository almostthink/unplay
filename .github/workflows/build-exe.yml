name: Build mail_checker.exe

on:
  push:
    branches: [ "**" ]
    paths:
      - "mail_checker.py"
      - "mailbox_manager.py"
      - "gui.py"
      - "web/**"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build GUI exe (HTML/CSS front end, bundled Chromium via Qt)
        # --onedir (not --onefile): safer for a bundled QtWebEngine.
        # --collect-all webview/PySide6 pulls in the Qt/Chromium runtime
        # files a plain --add-data would miss, so the exe doesn't depend
        # on the system having the Microsoft Edge WebView2 Runtime.
        run: pyinstaller --onedir --windowed --name mail_checker_gui --collect-all webview --collect-all PySide6 --add-data "web;web" gui.py

      - name: Build console/CLI exe
        run: pyinstaller --onefile --console --name mail_checker mail_checker.py

      - name: Upload GUI exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail_checker_gui-windows-exe
          path: dist/mail_checker_gui/

      - name: Upload CLI exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail_checker-windows-exe
          path: dist/mail_checker.exe
